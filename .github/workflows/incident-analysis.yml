name: Incident Investigation Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    name: Test and Analyze Incident
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: |
          python -m unittest discover -s tests -v

      - name: Analyze deployment incident
        run: |
          python incident_analyzer.py examples/deployment-failure.json --output incident-report.md

      - name: Add incident report to workflow summary
        run: |
          cat incident-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload incident report
        uses: actions/upload-artifact@v4
        with:
          name: incident-investigation-report
          path: incident-report.md
