name: Incident Investigation Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-analyze-and-build:
    name: Test, Analyze and Build Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: |
          python -m unittest discover -s tests -v

      - name: Analyze deployment incident
        run: |
          python incident_analyzer.py examples/deployment-failure.json --output incident-report.md

      - name: Add incident report to workflow summary
        run: |
          cat incident-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload incident report
        uses: actions/upload-artifact@v4
        with:
          name: incident-investigation-report
          path: incident-report.md

      - name: Build Docker image
        run: |
          docker build -t incident-investigator:test .

      - name: Test incident analyzer container
        run: |
          docker run --rm incident-investigator:test

      - name: Validate Docker Compose configuration
        run: |
          docker compose config

      - name: Start metrics exporter container
        run: |
          docker run --rm -d \
            --name metrics-exporter-test \
            -p 8000:8000 \
            --entrypoint python \
            incident-investigator:test \
            metrics_exporter.py \
            --data examples/deployment-failure.json \
            --port 8000

      - name: Verify health and Prometheus metrics
        run: |
          sleep 5
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/metrics
          docker stop metrics-exporter-test
